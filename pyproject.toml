[project]
name = "lucid-ohrc-psr"
version = "0.1.0"
description = "Self-supervised shadow/illumination segmentation for lunar PSRs from Chandrayaan-2 OHRC imagery (U-Net, Multi-Otsu pseudo-labels)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sankalp H S", email = "sankalp.sanku28@gmail.com" }]
maintainers = [{ name = "Sankalp H S", email = "sankalp.sanku28@gmail.com" }]
keywords = ["lunar", "psr", "chandrayaan-2", "ohrc", "segmentation", "unet", "remote-sensing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "numpy>=2.4.6",
  "scikit-image>=0.26.0",
  "scipy>=1.17.1",
  "matplotlib>=3.10.9",
  "albumentations>=2.0.8",
  "tqdm>=4.67.3",
  "pyyaml>=6.0.3",
  "tensorboard>=2.20.0",
  "segmentation-models-pytorch>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/sankalphs/ch-2_OHRC_PSRs"
Repository = "https://github.com/sankalphs/ch-2_OHRC_PSRs"
Issues = "https://github.com/sankalphs/ch-2_OHRC_PSRs/issues"

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.4.0", "black>=25.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
